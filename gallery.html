<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Image Gallery</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
      background-color: #f9f4ef; /* Light beige background */
    }

    h1 {
      text-align: center;
      padding: 20px;
      color: #800000; /* Maroon */
      background-color: #ffd700; /* Gold */
      margin: 0;
    }

    .gallery {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 20px;
      padding: 20px;
    }

    .gallery img {
      width: 250px;
      height: 180px;
      object-fit: cover;
      border: 3px solid #b8860b; /* Dark Gold */
      border-radius: 8px;
      transition: transform 0.3s, border-color 0.3s, box-shadow 0.3s;
    }

    .gallery img:hover {
      transform: scale(1.05);
      border-color: #800000; /* Maroon */
      box-shadow: 0 0 10px rgba(128, 0, 0, 0.6);
    }
  </style>
</head>
<body>
  <h1>My Image Gallery</h1>
  <div class="gallery">
    <img src="image4.jpg" alt="Image 1">
    <img src="image5.jpg" alt="Image 2">
    <img src="image6.jpg" alt="Image 3">
    <img src="image7.jpg" alt="Image 4">
    <img src="image8.jpg" alt="Image 5">
  </div>
</body>
</html>
